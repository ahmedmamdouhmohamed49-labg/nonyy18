<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Hanin</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#050510;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-family:Arial, sans-serif;
  }
  canvas{position:fixed;top:0;left:0;z-index:0}
  .text{position:relative;z-index:2;line-height:1.1}
  .text h1{
    font-size:90px;
    font-weight:900;
    color:#ff5fc8;
    text-shadow:0 0 25px #ff5fc8, 0 0 60px #ff5fc8;
  }
  .text h2{
    font-size:90px;
    font-weight:900;
    color:#ffd95e;
    text-shadow:0 0 25px #ffd95e, 0 0 60px #ffae00;
  }
  .text h3{
    font-size:100px;
    font-weight:900;
    color:#4fe3ff;
    text-shadow:0 0 25px #4fe3ff, 0 0 60px #00aaff;
  }
  @media(max-width:600px){
    .text h1,.text h2{font-size:55px}
    .text h3{font-size:65px}
  }
</style>
</head>
<body>
<canvas id="fireworks"></canvas>
<div class="text">
  <h1>Happy</h1>
  <h2>Birthday</h2>
  <h3>Hanin</h3>
</div>

<script>
const canvas=document.getElementById('fireworks');
const ctx=canvas.getContext('2d');
canvas.width=innerWidth; canvas.height=innerHeight;
let particles=[];
function createFirework(){
  const x=Math.random()*canvas.width;
  const y=Math.random()*canvas.height*0.5;
  const colors=['#ff5fc8','#ffd95e','#4fe3ff','#ff6b6b','#a78bfa'];
  const color=colors[Math.floor(Math.random()*colors.length)];
  for(let i=0;i<80;i++){
    const angle=Math.random()*Math.PI*2;
    const speed=Math.random()*6+1;
    particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:100,color});
  }
}
function animate(){
  ctx.fillStyle='rgba(5,5,16,0.2)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  particles=particles.filter(p=>p.life>0);
  particles.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--;
    ctx.beginPath(); ctx.arc(p.x,p.y,2,0,Math.PI*2);
    ctx.fillStyle=p.color; ctx.fill();
  });
  if(Math.random()<0.08) createFirework();
  requestAnimationFrame(animate);
}
for(let i=0;i<3;i++) createFirework();
animate();
window.onresize=()=>{canvas.width=innerWidth;canvas.height=innerHeight;}
</script>
</body>
</html>
